name: Build F-Droid repo & deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fdroidserver
        run: |
          sudo apt-get update
          sudo apt-get install -y apksigner
          pip install fdroidserver

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          # 공백/개행 제거 후 디코드 (붙여넣기 오염 방지)
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 -d > keystore.p12
          echo "decoded keystore size: $(wc -c < keystore.p12) bytes"
          # 검증: 인증서를 실제로 꺼내본다. 실패하면 여기서 명확히 죽는다.
          keytool -list -keystore keystore.p12 -storepass "$KEYSTORE_PASS" -alias hackminrepo \
            && echo "OK: keystore/비번 유효" \
            || { echo "ERROR: keystore 복원/비번 실패 — KEYSTORE_BASE64 또는 KEYSTORE_PASS 시크릿 확인"; exit 1; }

      - name: Inject keystore passwords into config
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          {
            echo ""
            echo "keystorepass: \"$KEYSTORE_PASS\""
            echo "keypass: \"$KEY_PASS\""
          } >> config.yml

      - name: Build repo index
        run: |
          fdroid update --create-metadata --pretty --verbose

      - name: Assemble Pages artifact
        run: |
          mkdir -p public/repo
          cp -r repo/* public/repo/
          if [ -d archive ]; then mkdir -p public/archive && cp -r archive/* public/archive/; fi
          cp landing/index.html public/index.html || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
